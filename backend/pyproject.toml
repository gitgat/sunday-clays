[project]
name = "sunday-clays"
version = "0.1.0"
description = "Sunday Clays: versioned score ingest and analytics API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.141",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "numpy>=2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",
    "scipy>=1.18",
    "sqlalchemy>=2.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.168",
    "mypy>=2.3",
    "pandas-stubs>=3.0",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.16",
    "scipy-stubs>=1.18",
    "testcontainers[postgres]>=4.15",
    "types-defusedxml>=0.7",
    "types-openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.9"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
markers = ["slow: timing tests (Plan 12 s60 budget); run by default, deselect with -m 'not slow'"]
filterwarnings = [
    "error",
    "ignore:Data Validation extension is not supported:UserWarning:openpyxl",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
