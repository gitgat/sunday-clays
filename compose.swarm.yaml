# Swarm overlay. The deployer service keeps the stack on main by itself; run
# `docker stack deploy` by hand only as in deploy/README.md "Deploy or upgrade" (pause the
# deployer, IMAGE_TAG from `deployer.py tag`, GHCR_USER and the deploy-time names below exported
# from secrets/deploy.env, resume).
# Deploy-time names come from the environment and have no defaults here: SC_REGISTRY (the private
# registry mirror every app image is pulled from), SC_DB_NODE (the database node's hostname) and
# SC_LAN_HOST (the LAN hostname of the router rule).
# The deployer mirrors each release's multi-arch index from GHCR into the registry, so only the
# deployer's manager needs a ghcr.io login (deploy/README.md "Automatic deploys").
# Images are multi-arch (linux/amd64 + linux/arm64), so caddy and the deployer carry no
# architecture constraint and run on any node, Pi or VM. The single-writer data services are
# pinned, by hostname, to the database node. api and worker are the one exception: they run on the
# x86 nodes only (x-x86 below); mcp is light and runs on any node. scripts/check_stack.py enforces all of this.
x-db-node: &db-node
  constraints:
    - node.hostname==${SC_DB_NODE:?SC_DB_NODE is required}

# api and worker run on x86 only (the database node or another x86 node): measured slow on a 4-core arm64 Pi
# while the database lives on x86 (the database node). Swarm has no soft "prefer", so this is a hard
# constraint; check_stack.py allows exactly this one architecture constraint, on these services.
x-x86: &x86
  constraints:
    - node.platform.arch==x86_64

# Automatic rollback (Plan 13): a task that never turns healthy, or fails within `monitor`,
# rolls its service back to the previous image. Every app service updates stop-first.
x-update: &update-rollback
  order: stop-first
  failure_action: rollback
  monitor: 60s

x-rollback: &rollback-stop-first
  order: stop-first

services:
  caddy:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      TRUSTED_PROXIES: private_ranges
    networks: [default, traefik_public, edge_public]
    deploy:
      update_config: *update-rollback
      rollback_config: *rollback-stop-first
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_public
        - traefik.http.routers.sundayclays.rule=Host(`sundayclays.claysmasher.com`)
        - traefik.http.routers.sundayclays.entrypoints=websecure
        - traefik.http.routers.sundayclays.tls=true
        - traefik.http.routers.sundayclays.tls.certresolver=cloudflare
        - traefik.http.routers.sundayclays.service=sundayclays
        - traefik.http.services.sundayclays.loadbalancer.server.port=80
        # LAN-only router: a client could send its own CF-Connecting-IP, so drop it (an empty value
        # removes the header). Caddy then falls back to X-Forwarded-For. The public path is
        # the edge proxy stack in the infra repo (edge_public), where Cloudflare sets the header.
        - traefik.http.middlewares.sundayclays-strip-cf.headers.customrequestheaders.CF-Connecting-IP=
        - traefik.http.routers.sundayclays.middlewares=sundayclays-strip-cf
        # LAN name on the fleet's wildcard DNS entry (-> ingress VIP); its own router so its
        # certificate never waits on the public claysmasher.com one.
        - traefik.http.routers.sundayclays-lan.rule=Host(`${SC_LAN_HOST:?SC_LAN_HOST is required}`)
        - traefik.http.routers.sundayclays-lan.entrypoints=websecure
        - traefik.http.routers.sundayclays-lan.tls=true
        - traefik.http.routers.sundayclays-lan.tls.certresolver=cloudflare
        - traefik.http.routers.sundayclays-lan.service=sundayclays
        - traefik.http.routers.sundayclays-lan.middlewares=sundayclays-strip-cf

  api:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    deploy:
      placement: *x86
      update_config: *update-rollback
      rollback_config: *rollback-stop-first
      restart_policy:
        condition: any

  worker:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    deploy:
      replicas: 1
      placement: *x86
      update_config: *update-rollback
      rollback_config: *rollback-stop-first
      # A full rebuild + skill calibration of the fixture history peaks at 224 MiB RSS (Plan 13
      # Decision 22): 1 GiB leaves room for years of growth and fits a 4 GB Raspberry Pi.
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      # `any`, not on-failure: SIGTERM (e.g. an unhealthy task) makes the worker finish its job
      # and exit 0, and a long-running service must never stay stopped after a clean exit.
      restart_policy:
        condition: any

  # Scores MCP server (deploy/README.md "Scores MCP"): the backend image with its own command. It is
  # reachable only through the deployment's MCP gateway, over the external MCP network (alias
  # sundayclays-mcp), never through the public edge. Read-only for now; the image has python but
  # no curl, hence the urllib healthcheck.
  mcp:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python", "-m", "sunday_clays.mcp"]
    environment:
      MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_token
      DATABASE_URL_FILE: /run/secrets/database_url
      MCP_PORT: "8080"
    secrets:
      - source: mcp_token
        target: mcp_token
      - database_url
    networks:
      default: {}
      mcp_gateway:
        aliases: [sundayclays-mcp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      update_config: *update-rollback
      rollback_config: *rollback-stop-first
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
      restart_policy:
        # `any`, like the other long-running services: uvicorn exits 0 on SIGTERM.
        condition: any

  db:
    volumes:
      - /var/data/sunday-clays/db:/var/lib/postgresql/data
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      placement: *db-node
      restart_policy:
        condition: any

  backup:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      BACKUP_HC_URL_FILE: /run/secrets/backup_hc_url
    secrets: [db_password, backup_hc_url]
    volumes:
      - /var/data/sunday-clays/backups:/backups
    deploy:
      replicas: 1
      update_config: *update-rollback
      rollback_config: *rollback-stop-first
      placement: *db-node
      restart_policy:
        condition: any

  # Pull-based auto-deployer (Plan 13; deploy/README.md "Automatic deploys"). The only service
  # allowed the Docker socket and a manager placement (scripts/check_stack.py). It never updates
  # db or itself; `docker stack deploy` refreshes it. Any manager will do, Pi or VM: the image is
  # multi-arch like the others. Its state (state.json, deploy.lock) is a bind under
  # /var/data/sunday-clays/deployer, NFS-shared by every node, never a named volume: it survives the
  # task moving to another manager, and `deployer.py pause|resume|tag|status` can run from any manager
  # as a one-off container on that directory (deploy/README.md "Automatic deploys").
  deployer:
    image: ${SC_REGISTRY:?SC_REGISTRY is required}/sunday-clays-deployer:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      GHCR_USER: ${GHCR_USER:?GHCR_USER is required}
      REGISTRY: ${SC_REGISTRY:?SC_REGISTRY is required}
      SOURCE_REGISTRY: ghcr.io/gitgat
      POLL_INTERVAL: "120"
    secrets: [deployer_github_token, deployer_ghcr_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/data/sunday-clays/deployer:/state
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role==manager
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any

networks:
  traefik_public:
    external: true
  # The infra repo's isolated public edge (cloudflared -> edge proxy -> caddy).
  edge_public:
    external: true
  # The MCP gateway's network (external, created by the deployment); the name is a deploy-time setting.
  mcp_gateway:
    external: true
    name: ${SC_MCP_NETWORK:-mcp_gateway}

# Restated in full: `docker stack` replaces top-level secret entries rather than merging them.
# Swarm secrets are immutable: rotate = new file content + bump SECRETS_REV + redeploy.
# The two deployer tokens expire on their own schedule, so they have their own DEPLOYER_SECRETS_REV.
secrets:
  session_secret:
    file: ./secrets/session_secret
    name: sundayclays_session_secret_v${SECRETS_REV:-1}
  viewer_password_hash:
    file: ./secrets/viewer_password_hash
    name: sundayclays_viewer_password_hash_v${SECRETS_REV:-1}
  admin_password_hash:
    file: ./secrets/admin_password_hash
    name: sundayclays_admin_password_hash_v${SECRETS_REV:-1}
  db_password:
    file: ./secrets/db_password
    name: sundayclays_db_password_v${SECRETS_REV:-1}
  database_url:
    file: ./secrets/database_url
    name: sundayclays_database_url_v${SECRETS_REV:-1}
  backup_hc_url:
    file: ./secrets/backup_hc_url
    name: sundayclays_backup_hc_url_v${SECRETS_REV:-1}
  deployer_github_token:
    file: ./secrets/deployer_github_token
    name: sundayclays_deployer_github_token_v${DEPLOYER_SECRETS_REV:-1}
  deployer_ghcr_token:
    file: ./secrets/deployer_ghcr_token
    name: sundayclays_deployer_ghcr_token_v${DEPLOYER_SECRETS_REV:-1}
  # The MCP bearer token, created out of band (external); the name is a deploy-time setting.
  mcp_token:
    external: true
    name: ${SC_MCP_TOKEN_SECRET:-sundayclays_mcp_token}
