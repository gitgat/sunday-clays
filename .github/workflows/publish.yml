# Push the CI-tested images to GHCR as multi-arch (linux/amd64 + linux/arm64) sha-<7> and latest
# (C11, Plan 13). Called only by ci.yml's `publish` job, after `ci-ok`, on main. Each architecture
# builds natively on its own runner, reusing the buildx GHA cache that ci.yml's `docker` and
# `docker-arm64` jobs wrote (arm64 keeps only final layers, mode=min: the repo's cache is capped at
# 10 GB), and pushes by digest only. `manifest` then puts both digests under one
# tag, so a sha-<7> tag exists only once both architectures do.
name: publish

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      deployer: ${{ steps.deployer.outputs.digest }}
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Docker Hub pulls (buildkit, base images, postgres) as gitgat, not anonymously: anonymous
      # pulls get rate-limited and sometimes refused ("unauthorized"). Read-only token.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: deployer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/deployer
          platforms: linux/amd64
          tags: ghcr.io/gitgat/sunday-clays-deployer
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=deployer
          cache-to: type=gha,mode=max,scope=deployer
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ghcr.io/gitgat/sunday-clays-backend
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/gitgat/sunday-clays-frontend
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      deployer: ${{ steps.deployer.outputs.digest }}
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Docker Hub pulls (buildkit, base images, postgres) as gitgat, not anonymously: anonymous
      # pulls get rate-limited and sometimes refused ("unauthorized"). Read-only token.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: deployer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/deployer
          platforms: linux/arm64
          tags: ghcr.io/gitgat/sunday-clays-deployer
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=deployer-arm64
          cache-to: type=gha,mode=min,scope=deployer-arm64
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ghcr.io/gitgat/sunday-clays-backend
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=min,scope=backend-arm64
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          tags: ghcr.io/gitgat/sunday-clays-frontend
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=min,scope=frontend-arm64

  manifest:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both architectures as sha-<7> and latest
        shell: bash
        env:
          DEPLOYER_AMD64: ${{ needs.amd64.outputs.deployer }}
          DEPLOYER_ARM64: ${{ needs.arm64.outputs.deployer }}
          BACKEND_AMD64: ${{ needs.amd64.outputs.backend }}
          BACKEND_ARM64: ${{ needs.arm64.outputs.backend }}
          FRONTEND_AMD64: ${{ needs.amd64.outputs.frontend }}
          FRONTEND_ARM64: ${{ needs.arm64.outputs.frontend }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          merge() {  # merge <image> <amd64 digest> <arm64 digest>
            local repo="ghcr.io/gitgat/sunday-clays-$1"
            # Check the list before tagging it, so a list that fails the check never gets a tag.
            docker buildx imagetools create --dry-run "$repo@$2" "$repo@$3" \
              | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' >/dev/null
            docker buildx imagetools create -t "$repo:$tag" -t "$repo:latest" "$repo@$2" "$repo@$3"
          }
          # The deployer first: the Swarm deployer starts a rollout once backend and frontend both
          # exist, so that pair is always the last thing a publish run tags, frontend last of all.
          merge deployer "$DEPLOYER_AMD64" "$DEPLOYER_ARM64"
          merge backend "$BACKEND_AMD64" "$BACKEND_ARM64"
          merge frontend "$FRONTEND_AMD64" "$FRONTEND_ARM64"
