# CI e2e: IMAGE_TAG=ci docker compose -f compose.yaml -f compose.test.yaml up -d --wait
# E2E_PORT (default 8080) moves the host port so parallel local stacks can coexist (CONTRIBUTING.md).
# Images come from `docker load` (pull_policy: never; Compose would re-pull otherwise).
services:
  caddy:
    pull_policy: never
    ports:
      - "${E2E_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
  api:
    pull_policy: never
    environment:
      COOKIE_SECURE: "false"
      WEATHER_ENABLED: "false"
      # Every e2e login comes from one IP: the default 10 failures / 15 min would turn a re-run
      # against a long-lived stack into 429s. Backend unit tests cover the limiter itself.
      LOGIN_MAX_FAILURES: "1000"
      # Every page-view beacon comes from that one IP too (about 190 page loads x 2 projects, plus
      # in-app navigation): the default 600 / 10 min would 429 late in a full run (Plan 16).
      PAGE_VIEW_LIMIT: "100000"
      # Every club-event sign-up and sign-up check comes from that one IP too (Plan 20 §7.4).
      CLUB_EVENT_SIGNUP_LIMIT: "1000"
      CLUB_EVENT_CHECK_LIMIT: "100000"
      # Wrong-email cancels (5 per run: 1 in the main flow, 2 at each viewport) share that IP too; the
      # default 10 per window would 403 a re-run.
      CLUB_EVENT_CANCEL_FAIL_LIMIT: "1000"
      # Plan 19 D4: the read-only e2e projects see every feature without a mutating setup step.
      # Production leaves FEATURES_DEFAULT_ON empty, so every feature starts off.
      FEATURES_DEFAULT_ON: "link_previews,tour_glossary,weekly_recap,pwa,club_milestones,summary_card"
    depends_on:
      db:
        condition: service_healthy
  worker:
    pull_policy: never
    environment:
      WEATHER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
  backup:
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
